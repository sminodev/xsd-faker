# Group minor and patch development updates; keep runtime and major updates separate.
# Vitest and its plugins are updated together because their versions must match.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns: [vitest, '@vitest/*']
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep types aligned with the oldest supported Node.js major in package.json.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint currently supports TypeScript versions below 6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
